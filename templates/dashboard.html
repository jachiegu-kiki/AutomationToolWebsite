{% extends "base.html" %}

{% block title %}工具大廳 - XDF 效能平台{% endblock %}

{% block content %}
<div class="container py-3">
    <div class="text-center mb-5">
        <h2 class="fw-bold" style="color: var(--xdf-green);">🚀 自動化工具箱</h2>
        <p class="text-muted">請選擇您要執行的業務流程</p>
    </div>

    <div class="row g-4 justify-content-center">
        {% for tool in workflows %}
        <div class="col-md-6 col-lg-4">
            <a href="/tool/{{ tool.id }}" class="text-decoration-none">
                <div class="card h-100 border-0 shadow-sm tool-card">
                    <div class="card-body p-4 text-center">
                        <div class="icon-box mb-3">
                            {{ tool.icon }}
                        </div>
                        <h5 class="card-title fw-bold text-dark">{{ tool.title }}</h5>
                        <p class="card-text text-muted small my-3 px-2">
                            {{ tool.description }}
                        </p>
                        <span class="btn btn-outline-success rounded-pill btn-sm px-4">
                            進入工具 <i class="bi bi-arrow-right ms-1"></i>
                        </span>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>

<style>
    .tool-card {
        transition: all 0.3s ease;
        background: #fff;
        border-radius: 16px;
    }
    .tool-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 30px rgba(0, 105, 95, 0.1) !important;
        border: 1px solid var(--xdf-green);
    }
    .icon-box {
        font-size: 3rem;
        /* 如果 icon 是 emoji 則保持原色，如果是 class icon 可用 color: var(--xdf-green); */
    }
    .btn-outline-success {
        color: var(--xdf-green);
        border-color: var(--xdf-green);
    }
    .btn-outline-success:hover {
        background-color: var(--xdf-green);
        color: #fff;
    }
</style>
{% endblock %}
