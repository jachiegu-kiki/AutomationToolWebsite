{% extends "base.html" %}

{% block title %}工具大厅 - GZQTcaiwu 效能平台{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mb-5 mt-4">
        <div class="col-md-8 text-center">
            <h3 class="fw-bold mb-2" style="color: var(--xdf-green);">自动化工具箱</h3>
            <p class="text-secondary small">选择下方的业务流程以开始工作</p>
        </div>
    </div>

    <div class="row g-4 justify-content-center">
        {% for tool in workflows %}
        <div class="col-md-4 col-lg-3">
            <a href="/tool/{{ tool.id }}" class="text-decoration-none">
                <div class="card h-100 border-0 shadow-sm tool-card">
                    <div class="card-body p-4 text-center">
                        <div class="icon-circle mb-3">
                            {{ tool.icon }}
                        </div>
                        <h6 class="card-title fw-bold text-dark mb-2">{{ tool.title }}</h6>
                        <p class="card-text text-secondary small mb-4 text-truncate-2" style="min-height: 40px; line-height: 1.5;">
                            {{ tool.description }}
                        </p>
                        <span class="btn btn-outline-success btn-sm w-100 rounded-pill" style="font-size: 12px; height: 32px;">
                            立即开启
                        </span>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>

<style>
    .tool-card {
        background: #fff;
        border-radius: 12px;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        border: 1px solid transparent;
    }
    .tool-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 24px rgba(0, 105, 95, 0.1) !important;
        border-color: var(--xdf-green);
    }
    .icon-circle {
        font-size: 2.5rem;
        margin-bottom: 15px;
    }
    .text-truncate-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .btn-outline-success {
        color: var(--xdf-green);
        border-color: var(--xdf-green);
    }
    .btn-outline-success:hover {
        background-color: var(--xdf-green);
        color: #fff;
    }
</style>
{% endblock %}
