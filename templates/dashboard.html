{% extends "base.html" %}

{% block title %}工具大廳 - KiKi 自動化平台{% endblock %}

{% block content %}
<div class="container">
    <div class="text-center mb-5 fade-in">
        <h2 class="fw-bold" style="color: var(--xdf-green);">🚀 歡迎回來，請選擇自動化工具</h2>
        <p class="text-secondary">XDF 內部效率提升工具組</p>
    </div>

    <div class="row justify-content-center">
        {% for tool in workflows %}
        <div class="col-md-6 col-lg-4 mb-4">
            <div class="card h-100 border-0 tool-card fade-in" onclick="location.href='/tool/{{ tool.id }}'">
                <div class="card-body p-4 text-center">
                    <div class="icon-circle mb-3">
                        {{ tool.icon }}
                    </div>
                    <h5 class="card-title fw-bold text-dark">{{ tool.title }}</h5>
                    <p class="card-text text-muted small my-3">{{ tool.description }}</p>

                    <button class="btn btn-outline-xdf w-100 rounded-pill mt-2">
                        進入工具 <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<style>
    .tool-card {
        background: white;
        border-radius: 20px;
        box-shadow: var(--card-shadow);
        transition: all 0.3s ease;
        cursor: pointer;
        border: 1px solid transparent;
    }

    .tool-card:hover {
        transform: translateY(-8px);
        border-color: var(--xdf-green);
    }

    .icon-circle {
        width: 70px;
        height: 70px;
        background: #f0fdf4; /* 極淡的綠色背景 */
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        font-size: 2rem;
        color: var(--xdf-green);
    }

    .btn-outline-xdf {
        border: 1px solid var(--xdf-green);
        color: var(--xdf-green);
        background: transparent;
        transition: all 0.3s;
    }

    .tool-card:hover .btn-outline-xdf {
        background: var(--xdf-green);
        color: white;
    }
</style>
{% endblock %}
