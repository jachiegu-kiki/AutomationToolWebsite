<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KiKi 自動化平台{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* ==================== XDF 品牌視覺系統 ==================== */
        :root {
            /* 核心品牌色 */
            --xdf-green: #00695F;       /* 新東方綠 */
            --xdf-green-hover: #004d45;
            --xdf-orange: #F39800;      /* 新東方橘 */
            --xdf-orange-hover: #d68600;

            /* 介面色 */
            --bg-color: #F4F6F9;        /* 更有質感的淡灰背景 */
            --card-shadow: 0 10px 30px rgba(0, 70, 60, 0.08); /* 帶有綠色調的陰影 */
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
        }

        body {
            font-family: 'Noto Sans TC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 導航欄設計 */
        .navbar {
            background-color: #fff !important;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            padding: 12px 0;
            border-top: 5px solid var(--xdf-green); /* 頂部品牌條 */
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--xdf-green) !important;
            letter-spacing: -0.5px;
        }

        /* 按鈕組件優化 */
        .btn-xdf-primary {
            background-color: var(--xdf-green);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 105, 95, 0.2);
        }

        .btn-xdf-primary:hover:not(:disabled) {
            background-color: var(--xdf-green-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 105, 95, 0.3);
            color: white;
        }

        .btn-xdf-action {
            background: linear-gradient(135deg, var(--xdf-orange) 0%, #ffae2e 100%);
            border: none;
            color: white;
            font-weight: bold;
        }
        .btn-xdf-action:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(243, 152, 0, 0.3);
            color: white;
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            background-color: #95a5a6;
        }

        /* 頁腳 */
        .footer {
            margin-top: auto;
            background: white;
            padding: 20px 0;
            text-align: center;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 0.85rem;
        }

        /* 全局過渡動畫 */
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <i class="bi bi-rocket-takeoff-fill me-2" style="color: var(--xdf-orange);"></i>
            KiKi 自動化平台
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link fw-bold" href="/" style="color: var(--xdf-green);">
                        <i class="bi bi-grid-fill me-1"></i> 工具大廳
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="py-4">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="container">
        <p class="mb-0">Designed for New Oriental (XDF) Internal Efficiency</p>
        <small>&copy; 2026 KiKi's Automation System</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
